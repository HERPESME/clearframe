[project]
name = "clearframe"
version = "0.1.0"
description = "Autonomous rights-clearance pipeline for film & TV (Gemini + Parallel)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    # multipart form parsing for footage + rights-ledger uploads
    "python-multipart>=0.0.9",
    # Ships a static ffmpeg binary, so audio extraction for fingerprinting
    # needs no system package on any platform (including Cloud Run).
    "imageio-ffmpeg>=0.5",
    # The clearance report is delivered as HTML and Word, and the Word file is
    # one of only two artifacts — an install that cannot produce it is broken,
    # so this is a base dependency rather than an extra. Pure Python; its one
    # compiled dependency (lxml) ships manylinux wheels, so the python:3.12-slim
    # image still needs no apt-get line.
    "python-docx>=1.1",
]

[project.optional-dependencies]
cloud = [
    "google-adk>=1.0",
    "google-genai>=1.0",
    # Second-opinion logo detector for identity corroboration.
    "google-cloud-videointelligence>=2.13",
]
deploy = ["google-cloud-aiplatform[agent_engines,adk]>=1.101.0"]
# Verifying a Firebase ID token. An OPTIONAL extra on purpose: the deployed
# demo image installs base dependencies only and today contains no Google
# packages at all, so this must not become the thing that puts grpcio in it.
# `webapp/auth.py` imports it lazily and the app runs without it.
auth = ["firebase-admin>=6.5.0"]
# The cloud storage profile: a bucket for blobs, Firestore for the index, Cloud
# Tasks for the queue. Optional for the same reason `auth` is — `pip install .`
# and the 826-test suite must keep working with none of it present, which is
# what `storage/cloud.py` importing every SDK inside a function body buys.
gcp = [
    "google-cloud-storage>=2.16",
    "google-cloud-firestore>=2.16",
    "google-cloud-tasks>=2.16",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
